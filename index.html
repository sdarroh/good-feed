<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Feed</title>
<link rel="alternate" type="application/rss+xml" title="Good Feed" href="feed.xml">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 40px 16px; font: 17px/1.5 Georgia, serif; background: #f6f1e7; color: #2a2a22; }
  main { max-width: 560px; margin: 0 auto; }
  code { display: block; padding: 12px; background: #fff; border-radius: 8px; word-break: break-all; font-size: 15px; }
  @media (prefers-color-scheme: dark) { body { background: #16201a; color: #ece6d8; } code { background: #22302a; } }
</style>
</head>
<body>
<main>
  <h1>Good Feed</h1>
  <p>This is a personal RSS feed. To follow it, add this address in Inoreader:</p>
  <code id="u">feed.xml</code>
</main>
<script>document.getElementById("u").textContent = new URL("feed.xml", location.href).href;</script>
</body>
</html>
